<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eceee8" />
    <meta name="description" content="Launch a token. Grow a world. Every token gets a world, every world gets an AI, and only the worlds that grow earn their own chain." />
    <title>WORLDSEED · Launch a token. Grow a world.</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WORLDSEED" />
    <meta property="og:title" content="WORLDSEED · Launch a token. Grow a world." />
    <meta property="og:description" content="Every token gets a world. Every world gets an AI. Only the worlds that grow earn their own chain." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WORLDSEED · Launch a token. Grow a world." />
    <meta name="twitter:description" content="Every token gets a world. Every world gets an AI. Only the worlds that grow earn their own chain." />
    <meta name="twitter:image" content="/og.png" />
    <script>
      try {
        var t = localStorage.getItem('worldseed:theme')
        if ((t === 'dark' || t === 'light') && !document.documentElement.getAttribute('data-theme')) document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <style>
      .arrive { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #eceee8; color: #141813; font: 500 11px/1.4 ui-monospace, 'IBM Plex Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; }
      [data-theme='dark'] .arrive { background: #0f1519; color: #e4ece2; }
      .arrive-in { display: grid; justify-items: center; gap: 14px; }
      .arrive-line { width: 120px; height: 2px; border-radius: 2px; overflow: hidden; position: relative; }
      .arrive-line::before { content: ''; position: absolute; inset: 0; background: currentColor; opacity: 0.12; }
      .arrive g { stroke: #eceee8; }
      [data-theme='dark'] .arrive g { stroke: #0f1519; }
      .arrive-line::after { content: ''; position: absolute; inset: 0; width: 40%; background: currentColor; animation: arrive 1.4s cubic-bezier(.6,0,.4,1) infinite; }
      @keyframes arrive { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .arrive-line::after { animation: none; width: 100%; opacity: 0.4; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="arrive" aria-label="Loading WORLDSEED" role="status">
        <div class="arrive-in">
          <svg viewBox="0 0 32 32" width="40" height="40" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor" /><g fill="none" stroke-width="1.6"><path d="M16 5.5c6.2 0 10.5 4.6 10.5 10.3S22 26.5 16 26.5 5.5 21.6 5.5 15.8 9.8 5.5 16 5.5Z" opacity=".55" /><path d="M16 10c3.5 0 6 2.6 6 5.9s-2.6 6-6 6-6-2.7-6-6S12.5 10 16 10Z" opacity=".8" /></g><circle cx="16" cy="15.9" r="2.6" fill="#c4ef3a" /></svg>
          <span>Surveying the Field</span>
          <span class="arrive-line"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
